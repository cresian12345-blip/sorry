    <title>Flowers</title>
    <script>
        let noClickCount = 0;
        const maxNoClicks = 5;
        
        setTimeout(() => {
            document.getElementById('forgivePopup').classList.remove('hidden');
        }, 20000);
        
        function handleNoClick() {
            noClickCount++;
            
            // Change GIF based on click count
            const gifFiles = ['../1.gif', '../2.gif', '../3.gif', '../4.gif', '../5.gif'];
            const gif = document.getElementById('clickGif');
            gif.src = gifFiles[noClickCount - 1];
            gif.style.display = 'block';
            
            // Make YES button larger
            const yesBtn = document.getElementById('yesBtn');
            const currentSize = parseFloat(yesBtn.style.transform.match(/scale\(([^)]+)\)/) ? yesBtn.style.transform.match(/scale\(([^)]+)\)/)[1] : '1');
            const newSize = currentSize + 0.3;
            yesBtn.style.transform = `scale(${newSize})`;
            
            // Hide NO button after 5 clicks
            if (noClickCount >= maxNoClicks) {
                document.getElementById('noBtn').style.display = 'none';
            }
        }
        
        function handleYesClick() {
            // Hide forgive popup
            document.getElementById('forgivePopup').classList.add('hidden');
            
            // Show success popup
            document.getElementById('successPopup').classList.remove('hidden');
        }
        
        function handleSuccessYes() {
            document.getElementById('successPopup').classList.add('hidden');
        }
    </script>

            <div class="forgive-buttons">

    </div>
